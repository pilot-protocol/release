name = "pilot-release"
account_id = "ef9da13de5572ea8482b2921770fa0e3"  # Vulture Labs — pin so deploys work from any checkout
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Route everything that hits pilotprotocol.network/install.sh,
# /.well-known/latest.json, /.well-known/cascade-status.json through
# this worker. The website (Cloudflare Pages) handles the rest.
routes = [
  { pattern = "pilotprotocol.network/install.sh", custom_domain = false },
  { pattern = "pilotprotocol.network/.well-known/*", custom_domain = false },
  # /api/changelog was implemented in src/index.ts but never routed —
  # requests fell through to the website worker (405), so every
  # tag-bump auto-changelog since the feature shipped silently skipped
  # (found 2026-07-13 when the first live cascade bumps landed).
  { pattern = "pilotprotocol.network/api/*", custom_domain = false },
]

[vars]
HUB_OWNER = "pilot-protocol"
HUB_REPO  = "pilotprotocol"
ORG       = "pilot-protocol"

# Secrets (set via `wrangler secret put`):
#   GH_TOKEN — fine-grained PAT or installation token with repo:read on
#              the hub repo + pilot-protocol/* (for cascade-status).

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "pilot-release-assets"

# Workers AI: provides env.AI.run(...) for LLM inference. First ~10k
# inferences/day are free. Used by /api/changelog.
[ai]
binding = "AI"
