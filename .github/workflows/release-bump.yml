name: release-bump

# Reusable workflow for Zone-2/3 (artifact-bearing) siblings.
#
# Zone-2/3 repos produce artifacts users install: web4 ships binaries,
# homebrew-pilot ships a formula, sdk-* ships packages. We never
# auto-tag in these zones — a maintainer must explicitly decide a
# release is appropriate. Instead, we open or update a single daily
# PR that coalesces every bump-upstream dispatch into one reviewable
# change. The maintainer merges when they want to ship.
#
# Why coalesce: a single common bump cascades to 15+ siblings, each
# of which fires its own tag, each of which dispatches another
# bump-upstream to web4. Without coalescing, web4 receives 15+ open
# PRs in rapid succession. With daily coalescing, the maintainer
# sees one PR per day with N commits, one per bumped upstream.

on:
  workflow_call:
    inputs:
      upstream:
        description: 'Upstream Go module path'
        required: true
        type: string
      version:
        description: 'Upstream tag to pin'
        required: true
        type: string
      is_prerelease:
        description: 'true when the upstream tag is a beta/rc/alpha'
        required: false
        default: false
        type: boolean
      stable_only:
        description: 'Skip this bump entirely if upstream is a prerelease'
        required: false
        default: true
        type: boolean
    secrets:
      RELEASE_APP_ID:
        description: 'pilot-release-bot App ID — coalesced PR created via App token so CI triggers'
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: 'pilot-release-bot private key (org secret)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Fixes the day of the coalescing branch once. Concurrency expressions
  # cannot call `date`, so the bump job takes the day from here for both
  # its concurrency group and its branch name, and the two always agree,
  # even for a run that waits in the queue past midnight.
  plan:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.day.outputs.day }}
    steps:
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  bump:
    needs: plan
    runs-on: ubuntu-latest
    # One bump at a time per daily branch. Several upstreams tagged
    # together fire one run each at the same moment; on 2026-10-07 three
    # hub runs raced on bump/2026-10-07 and two were rejected ("fetch
    # first"), losing their bumps. In a called workflow the github
    # context is the CALLER's, so github.repository is the repo that owns
    # the branch (web4 -> pilot-protocol/pilotprotocol), not this one.
    # queue: max keeps every waiting run (FIFO, up to 100). The default,
    # queue: single, would cancel the older of two pending runs, which
    # drops a bump just as the push race did.
    concurrency:
      group: release-bump-${{ github.repository }}-${{ needs.plan.outputs.day }}
      cancel-in-progress: false
      queue: max
    env:
      HAS_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Mint App token
        # PRs and pushes made with the default GITHUB_TOKEN never trigger
        # workflows (GitHub recursion guard), so required checks on bump
        # PRs would sit unreported forever. An App-minted token has no
        # such restriction. Optional: falls back to github.token when the
        # org secrets are not provided (bumps then need manual CI kicks).
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}


      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Stable-only gate
        id: gate
        run: |
          if [ "${{ inputs.is_prerelease }}" = "true" ] \
             && [ "${{ inputs.stable_only }}" = "true" ]; then
            echo "::notice::beta upstream ${{ inputs.version }} — stable_only, skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Coalesce into daily bump branch
        if: steps.gate.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          UP: ${{ inputs.upstream }}
          VER: ${{ inputs.version }}
          DAY: ${{ needs.plan.outputs.day }}
        run: |
          BRANCH="bump/${DAY}"

          # If the daily branch already exists on remote, fetch + check
          # it out so this commit lands on top of any earlier bump
          # from today. Otherwise create it.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi

          git config user.name  "pilot-release-bot"
          git config user.email "release-bot@pilotprotocol.network"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Bump, verify, commit, push. The concurrency group serialises
          # this workflow's own runs, but anything else that moves the
          # branch between our fetch and our push (a manual push, a run
          # still on the pre-queue workflow) makes the push non-fast-
          # forward. On a rejection, fetch the new tip and re-apply the
          # bump on top of it, up to 5 times. Re-applying rather than
          # `git rebase`: two bumps edit neighbouring require lines of
          # go.mod (common/dataexchange are adjacent) and go.sum, which
          # a textual rebase reports as a conflict, and even a clean one
          # can leave go.mod untidy for the combined requirements.
          RETRIES=5
          retry=0
          while :; do
            go mod edit -require="${UP}@${VER}"
            go mod tidy

            # Already pinned (on main, on the branch, or by the run that
            # beat us to the push with the same bump; a re-run or a
            # duplicate dispatch): nothing to add, and not an error.
            if git diff --quiet go.mod go.sum; then
              echo "::notice::${UP}@${VER} already pinned — idempotent skip"
              exit 0
            fi

            # Verify the bumped tree still builds + tests pass. If it
            # doesn't, leave the diff uncommitted so the next attempt
            # picks it up after the upstream issue is fixed. After a
            # replay this re-checks the combined tree; unchanged
            # packages come from the build and test caches.
            go build ./...
            go test ./... -short -timeout 5m

            git add go.mod go.sum
            git commit -m "deps: bump ${UP} to ${VER}"
            if git push origin "$BRANCH"; then
              break
            fi

            retry=$((retry + 1))
            if [ "$retry" -gt "$RETRIES" ]; then
              echo "::error::push to ${BRANCH} still rejected after ${RETRIES} retries"
              exit 1
            fi
            echo "::warning::push to ${BRANCH} rejected; retry ${retry}/${RETRIES} on top of the new tip"
            if git fetch origin "$BRANCH"; then
              git reset --hard FETCH_HEAD
            else
              # Branch not on the remote (the push failed for another
              # reason): drop our commit and re-apply on the same base.
              git reset --hard HEAD~1
            fi
          done

          # Open the PR if one is not already open for this branch.
          # If it exists, the push above appended a new commit; no
          # second PR is created. A create that fails because another
          # run opened the PR in the meantime is not an error.
          existing=$(gh pr list --head "$BRANCH" --state open \
                       --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            if ! gh pr create \
              --base main --head "$BRANCH" \
              --title "deps: daily bump ${DAY}" \
              --body "Auto-cascade from upstream releases. This PR coalesces every bump-upstream dispatch that arrived today; merge it when the daemon is ready to ship a new release. A merged commit on main fires the repo's own release.yml which tags + builds + publishes binaries. Until then, this PR is the queue."; then
              existing=$(gh pr list --head "$BRANCH" --state open \
                           --json number -q '.[0].number')
              if [ -z "$existing" ]; then
                echo "::error::could not create or find the PR for ${BRANCH}"
                exit 1
              fi
              echo "::notice::PR #${existing} opened concurrently for ${BRANCH}; appended commit"
            fi
          else
            echo "::notice::PR #${existing} already open for ${BRANCH}; appended commit"
          fi
