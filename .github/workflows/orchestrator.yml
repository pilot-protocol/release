name: orchestrator

# run-name carries the package + version so /.well-known/cascade-status.json
# (and the Actions UI) show which cascade a run is, not a generic
# "orchestrator". The worker parses "cascade <pkg>@<version>".
run-name: cascade ${{ github.event.client_payload.package || inputs.package }}@${{ github.event.client_payload.version || inputs.version }}

# Central release orchestrator. Receives `package-released` from any
# sibling, computes the reverse-transitive closure from the live
# dependency graph (built on-demand from each repo's go.mod), then
# dispatches `bump-upstream` to every node that depends on the
# released package — in BFS-by-depth order so parents finish before
# children start.
#
# Dedupe: the same (package, version) within 5 minutes is treated as
# a no-op (network retries, manual reruns). The window is enforced
# by writing the (package, version, ts) to a workflow concurrency
# group named after the tuple — concurrent runs supersede each other.
#
# Token: a GitHub App installation (RELEASE_APP) covers the entire
# pilot-protocol org plus pilot-protocol/pilotprotocol. One app, one
# install, no per-repo secrets.

on:
  repository_dispatch:
    types: [package-released]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name'
        required: true
      version:
        description: 'Tag (vX.Y.Z or vX.Y.Z-beta.N)'
        required: true
      is_prerelease:
        description: 'true if upstream is prerelease'
        type: boolean
        default: false
      dry_run:
        description: 'Compute + print closure; do not dispatch'
        type: boolean
        default: false

permissions:
  contents: read

# PILOT-267: cancel-in-progress was false — a manual rerun while a
# run was in flight would stack a second dispatch wave, so every
# downstream got bumped twice and the cascade ended up with duplicate
# tags + conflicting commits. Cancel the in-flight run instead so the
# re-fire is the only active dispatcher for this (package, version).
concurrency:
  group: cascade-${{ github.event.client_payload.package || inputs.package }}-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: true

jobs:
  fan-out:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Mint App token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: pilot-protocol

      - name: Compute closure
        id: closure
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PKG: ${{ github.event.client_payload.package || inputs.package }}
          VER: ${{ github.event.client_payload.version || inputs.version }}
          PRE: ${{ github.event.client_payload.is_prerelease || inputs.is_prerelease }}
        run: |
          python3 scripts/compute-closure.py \
            --package "$PKG" \
            --version "$VER" \
            --is-prerelease "$PRE" \
            --policy policy.json \
            --output /tmp/closure.json
          cat /tmp/closure.json
          jq -r '.targets[] | "  " + .repo + " (depth=" + (.depth|tostring) + ", zone=" + (.zone|tostring) + ")"' /tmp/closure.json

      - name: Dispatch in waves
        # NOTE: dry_run is a type:boolean input, so it must be compared as
        # a boolean. The previous `inputs.dry_run != 'true'` compared
        # boolean-vs-string, which is always truthy in Actions expressions
        # — dry runs dispatched for real (caught 2026-07-13 validating the
        # web4 v1.12.5 cascade). On repository_dispatch events inputs is
        # empty, so !inputs.dry_run stays true and the step runs.
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PKG: ${{ github.event.client_payload.package || inputs.package }}
          VER: ${{ github.event.client_payload.version || inputs.version }}
          PRE: ${{ github.event.client_payload.is_prerelease || inputs.is_prerelease }}
        run: |
          # Wave dispatch: send all depth-N targets, wait for each
          # repo's workflow_run to reach completion before moving to
          # depth N+1. This guarantees that when handshake gets its
          # bump-upstream from a common bump, common is already
          # tagged + visible — no stale go.mod resolution.
          waves=$(jq -r '[.targets[].depth] | unique | sort | .[]' /tmp/closure.json)

          # Receivers run `go get <upstream>@<version>`, so upstream must
          # be the full module path, not the bare package name — bare
          # names fail with 'malformed module path "app-store": missing
          # dot in first path element' in every receiver (seen on the
          # app-store v1.0.1 catch-up, 2026-07-13). Package names map
          # 1:1 to org module paths; the hub is the one exception.
          case "$PKG" in
            web4) UP_MODULE="github.com/pilot-protocol/pilotprotocol" ;;
            *)    UP_MODULE="github.com/pilot-protocol/${PKG}" ;;
          esac

          rm -f /tmp/dispatch-failures
          for d in $waves; do
            echo "::group::Wave depth=$d"
            # mode=="poll" targets self-update by polling the upstream
            # release (homebrew-pilot's update-formula.yml) — they need
            # no dispatch, and TeoSlayer/* owners don't have the
            # pilot-release-bot App installed anyway (guaranteed 403).
            # Process substitution, not a pipe: the loop must run in
            # this shell so the failure marker survives it.
            while read -r tgt; do
                repo=$(echo "$tgt"  | jq -r .repo)
                zone=$(echo "$tgt"  | jq -r .zone)
                payload=$(jq -nc \
                  --arg up "$UP_MODULE" --arg ver "$VER" --argjson pre "$PRE" \
                  '{event_type: "bump-upstream",
                    client_payload: {upstream: $up, version: $ver, is_prerelease: $pre}}')

                HTTP_CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' \
                  -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/${repo}/dispatches" \
                  -d "$payload")

                if [ "$HTTP_CODE" = "204" ]; then
                  echo "  ✓ ${repo} (zone=${zone})"
                else
                  # PILOT-257 made this loud instead of a silent warning.
                  # But `exit 1` here aborted the ENTIRE cascade at the
                  # first unreachable target (2026-07-13: the homebrew
                  # 403 at depth 1 meant no other dependent ever got its
                  # bump). Stay loud — error annotation + failed run —
                  # without robbing every other target of its dispatch.
                  echo "::error::dispatch failed for ${repo}: HTTP ${HTTP_CODE} (depth=${d} zone=${zone})"
                  cat /tmp/resp
                  echo "${repo}" >> /tmp/dispatch-failures
                fi
              done < <(jq -c ".targets[] | select(.depth == $d) | select((.mode // \"auto\") != \"poll\")" /tmp/closure.json)

            # Best-effort wave barrier: give the dispatched workflows
            # 60s to start + ~2 min to finish a typical bump. The
            # next wave's bump runs will pull main and see the tags.
            # Not a hard sync — for hard sync, use workflow_run polls.
            sleep 90
            echo "::endgroup::"
          done

          if [ -f /tmp/dispatch-failures ]; then
            echo "::error::cascade completed with failed dispatches: $(paste -sd' ' /tmp/dispatch-failures)"
            exit 1
          fi
