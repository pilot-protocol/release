name: tag-bump

# Reusable workflow for Zone-1 (tag-only) siblings.
#
# When called: a sibling's cascade.yml receives a `bump-upstream`
# repository_dispatch and forwards it to this workflow. We:
#
#   1. Gate on stable_only — beta upstreams are skipped per default.
#   2. Bump go.mod against the supplied upstream version.
#   3. Verify the build + tests still pass.
#   4. Compute the next beta tag in the current series.
#   5. Commit + tag + push to origin/main.
#
# The "tag-only" zone has no GitHub release page, no artifact build.
# A tag is the only output; downstream cascades trigger on tag push.

on:
  workflow_call:
    inputs:
      upstream:
        description: 'Upstream Go module path (e.g. github.com/pilot-protocol/common)'
        required: true
        type: string
      version:
        description: 'Upstream tag to pin (e.g. v0.5.0 or v0.5.1-beta.3)'
        required: true
        type: string
      is_prerelease:
        description: 'true when the upstream tag is a beta/rc/alpha'
        required: false
        default: false
        type: boolean
      stable_only:
        description: 'Skip this bump entirely if upstream is a prerelease'
        required: false
        default: true
        type: boolean
    secrets:
      CHANGELOG_SECRET:
        description: 'HMAC secret for pilotprotocol.network/api/changelog'
        required: false
      RELEASE_APP_ID:
        description: 'pilot-release-bot App ID — bump PRs created via App token so CI triggers'
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: 'pilot-release-bot private key (org secret)'
        required: false

permissions:
  contents: write
  pull-requests: write   # bump lands via PR + auto-merge (protected mains)

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Mint App token
        # PRs and pushes made with the default GITHUB_TOKEN never trigger
        # workflows (GitHub recursion guard), so required checks on bump
        # PRs would sit unreported forever. An App-minted token has no
        # such restriction. Optional: falls back to github.token when the
        # org secrets are not provided (bumps then need manual CI kicks).
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}


      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Stable-only gate
        id: gate
        run: |
          if [ "${{ inputs.is_prerelease }}" = "true" ] \
             && [ "${{ inputs.stable_only }}" = "true" ]; then
            echo "::notice::beta upstream ${{ inputs.version }} — stable_only, skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Bump go.mod + verify build
        id: bump
        if: steps.gate.outputs.skip != '1'
        env:
          UP: ${{ inputs.upstream }}
          VER: ${{ inputs.version }}
        run: |
          # PILOT-268: Strip any `replace github.com/pilot-protocol/...`
          # entries — dev-time artifacts pointing at ../sibling paths
          # which CI doesn't have. Without them, go uses the real
          # published version, which is what production should always use.
          #
          # Use `go mod edit -json` instead of grepping go.mod so both the
          # single-line form (`replace foo => ../foo`) AND the block form
          # (`replace (\n foo => ../foo\n)`) get picked up. The previous
          # `grep -E '^replace[[:space:]]'` regex missed the block form,
          # which left replaces in place and broke `go mod tidy` on CI.
          go mod edit -json | jq -r '
            (.Replace // [])[]
            | .Old.Path
            | select(startswith("github.com/pilot-protocol/"))
          ' | while read -r r; do
                echo "::notice::stripping dev-replace: ${r}"
                go mod edit -dropreplace="${r}"
              done

          # Unconditionally drop the legacy pilot-protocol/pilotprotocol
          # require + replace — pre-migration sentinels pinned to
          # v0.0.0 that never resolve from the proxy. go mod edit
          # is a no-op when the entry is absent, so safe.
          echo "::notice::dropping legacy TeoSlayer hub entries"
          go mod edit -droprequire=github.com/pilot-protocol/pilotprotocol 2>/dev/null || true
          go mod edit -dropreplace=github.com/pilot-protocol/pilotprotocol 2>/dev/null || true

          go mod edit -require="${UP}@${VER}"
          go mod tidy

          # Idempotency: if the bump produced no diff, we already pin
          # this version. Exit with code 0 + skip flag so subsequent
          # steps don't try to tag.
          if git diff --quiet go.mod go.sum; then
            echo "::notice::no go.mod changes — idempotent skip"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          go build ./...
          go test ./... -short -timeout 5m
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Compute next beta tag
        id: v
        if: steps.gate.outputs.skip != '1' && steps.bump.outputs.skip != '1'
        run: |
          # Highest STRICT-stable tag: exactly v<int>.<int>.<int>, no
          # suffix. L3 fix: the old `grep -v -- '-(beta|rc|...)\.'`
          # required a dot after the suffix, so a dotless prerelease
          # (v1.0.0-rc1) slipped through as "stable" and blew up the
          # arithmetic below (p="0-rc1"). Positive-match the canonical
          # shape instead.
          stable=$(git tag -l 'v*' --sort=-v:refname \
                   | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          stable=${stable:-v0.0.0}

          # Target series is always the next patch of current stable.
          # Humans steer the major/minor cadence by tagging stables.
          IFS='.' read -r M m p <<<"${stable#v}"
          series="v${M}.${m}.$((p + 1))"

          # Find the highest beta number in the target series.
          last=$(git tag -l "${series}-beta.*" --sort=-v:refname \
                 | head -1 \
                 | sed -E 's/.*-beta\.([0-9]+)$/\1/')

          new_tag="${series}-beta.$(( ${last:-0} + 1 ))"
          echo "::notice::computed next tag: ${new_tag}"
          echo "tag=${new_tag}" >> "$GITHUB_OUTPUT"

      - name: Commit, PR, auto-merge, tag
        if: steps.gate.outputs.skip != '1' && steps.bump.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          NEW_TAG: ${{ steps.v.outputs.tag }}
          UP: ${{ inputs.upstream }}
          VER: ${{ inputs.version }}
        run: |
          # Every zone-1 repo protects main with require-PR (0 approvals)
          # + the "test" status check, and the built-in github-actions app
          # cannot be granted a bypass (classic allowances silently drop
          # it; repo rulesets reject it). Direct pushes therefore NEVER
          # worked — every historical auto-tag either failed or predates
          # protection. Land the bump the way the protection wants:
          # branch -> PR -> auto-merge once "test" passes -> tag the
          # merge commit. Bonus: the bump is now validated by the repo's
          # own CI before main moves, not just by this workflow's build.
          git config user.name  "pilot-release-bot"
          git config user.email "release-bot@pilotprotocol.network"
          # Push/PR as the App when its token is present: checkout's
          # persisted extraheader (github.token) would win over URL
          # credentials, so drop it and re-point the remote.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          BRANCH="bump/$(printf '%s' "${UP##*/}" | tr -c 'a-zA-Z0-9.-' '-')-${VER}"
          git checkout -b "$BRANCH"
          git add go.mod go.sum
          git commit -m "deps: bump ${UP} to ${VER}" \
                     -m "auto-tagged ${NEW_TAG}"
          git push -f origin "HEAD:${BRANCH}"

          # No stderr swallowing: if PR creation fails (e.g. the org's
          # "Allow GitHub Actions to create pull requests" toggle is off),
          # the error must be visible, not a cryptic "no pull requests
          # found" from the view fallback (2026-07-13).
          if ! PR_URL=$(gh pr create --head "$BRANCH" --base main \
            --title "deps: bump ${UP##*/} to ${VER} (auto-cascade ${NEW_TAG})" \
            --body "Automated cascade bump from the release orchestrator. Tags ${NEW_TAG} on merge."); then
            PR_URL=$(gh pr view "$BRANCH" --json url --jq .url) || {
              echo "::error::could not create or find bump PR for ${BRANCH} — check the org setting 'Allow GitHub Actions to create and approve pull requests'"
              exit 1
            }
          fi
          echo "::notice::bump PR: ${PR_URL}"

          # The github-actions token cannot ENABLE auto-merge on a
          # protected branch ("User is not authorized for this protected
          # branch", 2026-07-13) — but it CAN merge outright once the
          # required checks are green. So retry a plain squash-merge
          # until the checks gate opens. 20 min cap.
          MERGED=0
          for i in $(seq 1 40); do
            STATE=$(gh pr view "$BRANCH" --json state --jq .state)
            [ "$STATE" = "CLOSED" ] && { echo "::error::bump PR closed without merge"; exit 1; }
            [ "$STATE" = "MERGED" ] && { MERGED=1; break; }
            # REST, not `gh pr merge`: the CLI's GraphQL mergePullRequest
            # mutation rejects App installations with "base branch policy
            # prohibits the merge" even when the PR is CLEAN and a plain
            # user merge succeeds (observed webhook#20, 2026-07-13). The
            # REST merge endpoint evaluates the same protection correctly.
            PR_NUM="${PR_URL##*/}"
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUM}/merge" \
                 -f merge_method=squash >/tmp/merge-out 2>/tmp/merge-err; then
              git push origin --delete "$BRANCH" 2>/dev/null || true
              MERGED=1; break
            fi
            echo "merge attempt $i: $(tr -d '\n' </tmp/merge-err | head -c 300)"
            sleep 30
          done
          if [ "$MERGED" != "1" ]; then
            echo "::error::bump PR did not merge within 20 min (checks stuck/failing): ${PR_URL}"
            cat /tmp/merge-err 2>/dev/null
            exit 1
          fi

          MERGE_SHA=$(gh pr view "$BRANCH" --json mergeCommit --jq .mergeCommit.oid)
          git fetch origin main
          git tag "$NEW_TAG" "$MERGE_SHA"
          git push origin "$NEW_TAG"
          echo "::notice::merged ${PR_URL} and tagged ${NEW_TAG} @ ${MERGE_SHA} → cascade will fan out next"

      - name: Auto-changelog + GitHub release
        # Asks pilotprotocol.network/api/changelog (Workers AI) for a
        # short LLM-written summary of why this beta exists, then
        # creates a GitHub release with the summary as the body.
        # Skips silently when CHANGELOG_SECRET is not configured.
        if: steps.gate.outputs.skip != '1' && steps.bump.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.v.outputs.tag }}
          UP: ${{ inputs.upstream }}
          VER: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SECRET: ${{ secrets.CHANGELOG_SECRET }}
        run: |
          # Strip the github.com/<org>/ prefix so the upstream is just
          # the package name (e.g. "common").
          PKG="${UP##*/}"

          # Best-effort LLM summary. A blank summary (secret absent, worker
          # error, bad response) is NOT fatal — the release is created
          # regardless (see below). This is the H1 fix: release-watch polls
          # RELEASES, and tag-bump only produces a TAG; if the release were
          # created only on changelog success (which never succeeded —
          # H2), no auto-bump ever re-entered the cascade.
          summary=""
          if [ -n "$SECRET" ]; then
            body=$(jq -nc \
              --arg r  "$REPO" \
              --arg t  "$NEW_TAG" \
              --arg up "$PKG" \
              --arg uv "$VER" \
              '{repo:$r, tag:$t, upstream_pkg:$up, upstream_version:$uv}')

            # PILOT-258: HMAC via Python's hmac module so the secret never
            # enters argv. H2 fix: sign the EXACT bytes curl sends —
            # `printf '%s'`, not a `<<<` herestring, which appends a
            # newline so the worker's HMAC(bodyText) never matched and
            # every call 401'd.
            sig="sha256=$(printf '%s' "$body" | SECRET="$SECRET" python3 -c 'import hmac,hashlib,os,sys; print(hmac.new(os.environ["SECRET"].encode(),sys.stdin.buffer.read(),hashlib.sha256).hexdigest())')"

            if resp=$(curl -fsS -X POST https://pilotprotocol.network/api/changelog \
                -H "content-type: application/json" \
                -H "x-signature: ${sig}" \
                -d "$body" 2>/tmp/changelog-err); then
              s=$(echo "$resp" | jq -r '.summary // empty')
              if [ -n "$s" ]; then
                summary="$s"
              else
                echo "::warning::changelog response had no summary"
              fi
            else
              echo "::warning::changelog endpoint failed:"
              cat /tmp/changelog-err
            fi
          else
            echo "::notice::CHANGELOG_SECRET not provided; release will use a plain body"
          fi

          # Build the release body. Falls back to a plain note when no LLM
          # summary is available so the release is ALWAYS created.
          body_file=$(mktemp)
          {
            if [ -n "$summary" ]; then
              printf '%s\n\n' "$summary"
            else
              printf 'Automated cascade bump of %s to %s.\n\n' "$PKG" "$VER"
            fi
            printf -- '---\n'
            printf '*Auto-generated by pilot-release-bot — cascade origin: %s@%s*\n' "$UP" "$VER"
          } > "$body_file"

          # Always create/update the release. --prerelease because
          # tag-bump only ever produces -beta.* tags.
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            gh release edit "$NEW_TAG" --notes-file "$body_file" --prerelease
          else
            gh release create "$NEW_TAG" --prerelease --title "$NEW_TAG" --notes-file "$body_file"
          fi
          echo "::notice::published release ${NEW_TAG} (llm_summary=$([ -n "$summary" ] && echo yes || echo no))"
